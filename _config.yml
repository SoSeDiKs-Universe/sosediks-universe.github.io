# Variables can be accessed via {{ site.title }}
title: SoSeDiK's Universe
url: "https://sosedik.com"
discord_invite: "https://discord.gg/vrMgAsXK8z"
server_address: "sosedik.com"
server_version: "26.2"

# Polyglot
default_lang: "en"
languages: ["en", "ru", "uk"]
exclude_from_localization: [assets, sitemap.xml, robots.txt]
parallel_localization: true

# Options
plugins:
  - jekyll-polyglot

# Misc
exclude:
  - CNAME
  - README.md
  - LICENSE
  - shell.nix
  - flake.nix
  - flake.lock
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
